<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Showcase - E-Signing Portal</title>
    <base href="/" />
    <link rel="icon" href="favicon.ico" />
    <link rel="preload" id="webassembly" />
    <!-- Syncfusion Tailwind 3 theme first so the factory tokens in the app stylesheet override its variables.
         Blazor ships light and dark as two files; the script below picks one before first paint and
         wwwroot/js/app.js swaps it when the theme changes. -->
    <link id="sf-theme" rel="stylesheet" href="_content/Syncfusion.Blazor.Themes/tailwind3.css" />
    <script>
      // The theme chosen in this tab survives a refresh (sessionStorage); a new session starts from the system setting.
      (function () { var t = null; try { t = sessionStorage.getItem('e-signing-portal-theme'); } catch (e) {} if (t !== 'light' && t !== 'dark') { t = 'light'; try { if (matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark'; } catch (e) {} } document.documentElement.dataset.theme = t; document.documentElement.classList.toggle('e-dark-mode', t === 'dark'); if (t === 'dark') document.getElementById('sf-theme').href = '_content/Syncfusion.Blazor.Themes/tailwind3-dark.css'; })();
    </script>
    <link rel="stylesheet" href="css/preflight.css" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- Loading states (as in the reference's index.html): the indicator styles live here because the app's CSS and
         the Syncfusion theme may not have loaded yet. Shared/AppLoading.razor reuses them. -->
    <style>
      :root { --app-loading-bg: #f8fafc; --app-loading-fg: #667085; --app-loading-ring: #175cd3; --app-loading-track: #dbe5f5; }
      :root[data-theme='dark'] { --app-loading-bg: #0f172a; --app-loading-fg: #94a3b8; --app-loading-ring: #60a5fa; --app-loading-track: #1e3a6e; }
      html, body { margin: 0; background: var(--app-loading-bg); }
      .app-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        min-height: 240px; padding: 24px; box-sizing: border-box; color: var(--app-loading-fg);
        font: 500 14px/1.4 Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
      .app-loading--screen { position: fixed; inset: 0; min-height: 0; background: var(--app-loading-bg); z-index: 3000; }
      .app-loading--overlay { position: absolute; inset: 0; min-height: 0; background: var(--app-loading-bg); z-index: 5; }
      .app-loading__ring { width: 36px; height: 36px; border-radius: 50%; box-sizing: border-box;
        border: 3px solid var(--app-loading-track); border-top-color: var(--app-loading-ring); animation: app-loading-spin 0.8s linear infinite; }
      @keyframes app-loading-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .app-loading__ring { animation: none; border-color: var(--app-loading-ring); } }
      #blazor-error-ui { display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 4000; padding: 12px 16px;
        background: #fef3f2; color: #b42318; font: 14px/1.4 system-ui, sans-serif; box-shadow: 0 -1px 4px rgba(0,0,0,.2); }
      #blazor-error-ui .reload { margin-left: 8px; color: inherit; }
      #blazor-error-ui .dismiss { float: right; cursor: pointer; }
    </style>
    <script type="importmap"></script>
</head>
<body>
    <!-- Startup screen, outside #app so it stays while the shell mounts underneath; the shell removes it after its
         first render, once the theme has loaded. -->
    <div id="app-boot" class="app-loading app-loading--screen" role="status" aria-live="polite"><div class="app-loading__ring" aria-hidden="true"></div><div>Loading E-Signing Portal…</div></div>
    <div id="app"></div>
    <div id="blazor-error-ui" role="alert">
        Something went wrong. <a href="." class="reload">Reload</a>
        <span class="dismiss" aria-label="Dismiss">✕</span>
    </div>
    <script src="_content/Syncfusion.Blazor.Core/scripts/syncfusion-blazor.min.js" type="text/javascript"></script>
    <script src="_content/Syncfusion.Blazor.SfPdfViewer/scripts/syncfusion-blazor-sfpdfviewer.min.js" type="text/javascript"></script>
    <script src="js/app.js"></script>
    <script src="js/viewer.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>
</html>
